<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FB 1:1 price</title>
  <link rel="stylesheet" href="ad.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Source+Sans+3:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    html,body,.frame{width:1080px;height:1080px;background:#173a5c}
    .inner{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:80px;color:#fff}
    .inner h1{font-size:70px;margin:12px 0 24px}
    .inner .sub{font-size:32px}
    .big{font-family:"Playfair Display",Georgia,serif;font-size:180px;line-height:.85;font-weight:700}
    .big span{font-size:64px;vertical-align:super}
  </style>
</head>
<body>
  <div class="frame">
    <p class="logo">Scenic City Learning</p>
    <div class="inner">
      <p class="kicker">Simple rate · Red Bank</p>
      <p class="big"><span>$</span>40</p>
      <h1>per hour. One child. A licensed teacher.</h1>
      <p class="sub">K–5 reading, math, writing, test prep, accelerated learners.</p>
      <span class="cta">Text (929) 256-3772</span>
    </div>
  </div>
</body>
</html>
