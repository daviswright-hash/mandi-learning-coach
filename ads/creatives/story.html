<!DOCTYPE html>
<html lang="en">
<head>

  <style>
    html,body,.frame{width:1080px;height:1920px}
    .bg{object-position:center 15%}

  <div class="frame">
    <img class="bg" src="../photos/mandi-warm.jpg" alt="" />

      <h1>When homework turns into a fight.</h1>
      <p class="sub">A licensed K–5 teacher. $40/hour. At my house — not a noisy coffee shop.</p>
      <span class="cta">Text (929) 256-3772</span>
    </div>
  </div>
</body>
</html>
